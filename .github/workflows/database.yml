name: Deploy database

# Applies SQL migrations in supabase/migrations/ to the Supabase project via
# the Management API (see supabase/apply-migrations.mjs). Every DB change is a
# new migration file — edit source, push, CI applies it. See docs/DEPLOYMENT.md.
#
# Needs only one secret (SUPABASE_ACCESS_TOKEN) + one variable
# (SUPABASE_PROJECT_REF). No database password / direct connection.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/apply-migrations.mjs'
      - '.github/workflows/database.yml'
  workflow_dispatch: {}

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply migrations
        run: node supabase/apply-migrations.mjs
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
